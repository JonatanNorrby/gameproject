name: Prompt11 Validation
on:
  push:
    branches: [migration/projectiles-lifecycle]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check migrated modules
        run: |
          node --check js/combat/projectiles.js
          node --check js/combat/statusEffects.js
          node --check js/combat/lifecycle.js
          node --check js/combat/combat.js
          node --check js/enemies/enemyCombat.js
          node --check js/enemies/enemyStatus.js
          node --check js/enemies/enemies.js
      - name: Run all clean-runtime regression suites
        run: node --test tests/*.test.mjs
