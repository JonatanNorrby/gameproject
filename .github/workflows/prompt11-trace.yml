name: Prompt11 Trace
on:
  push:
    branches: [migration/projectiles-lifecycle]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace legacy projectile/status/lifecycle owners
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('.').filter(f=>/^v\d.*\.js$/.test(f));
          const terms=['bullets','enemyBullets','burnTick','slowTime','acidTime','damageTarget','hitEnemy','shipHp','passengerId','gameOver','baseHp'];
          for (const f of files){
            const s=fs.readFileSync(f,'utf8');
            let printed=false;
            for(const term of terms){
              let start=0, n=0;
              while((start=s.indexOf(term,start))>=0 && n<10){
                if(!printed){ console.log(`\n===== ${f} =====`); printed=true; }
                const a=Math.max(0,start-320), b=Math.min(s.length,start+900);
                console.log(`\n--- ${term} @ ${start} ---\n${s.slice(a,b).replace(/\n/g,' ')}`);
                start+=term.length; n++;
              }
            }
          }
          NODE
