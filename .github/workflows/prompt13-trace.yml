name: Prompt13 Validation
on:
  push:
    branches: [migration/input-ui-camera-placement]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Prompt 13 modules
        run: |
          node --check js/input/camera.js
          node --check js/input/interaction.js
          node --check js/input/input.js
          node --check js/ui/domSetup.js
          node --check js/ui/ui.js
          node --check js/units/deployment.js
          node --check js/units/transport.js
          node --check js/units/platoons.js
          node --check js/units/support.js
          node --check js/buildings/placement.js
          node --check js/buildings/construction.js
          node --check js/buildings/buildings.js
          node --check js/core/state.js
          node --check js/main.js
      - name: Run all clean-runtime regression suites
        run: node --test tests/*.test.mjs
