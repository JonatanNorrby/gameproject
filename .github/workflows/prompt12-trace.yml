name: Prompt12 Validation
on:
  push:
    branches: [migration/fog-rendering-assets]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Prompt 12 modules
        run: |
          node --check js/fog/fog.js
          node --check js/rendering/culling.js
          node --check js/rendering/renderer.js
          node --check js/assets/assets.js
          node --check js/core/game.js
      - name: Run all clean-runtime regression suites
        run: node --test tests/*.test.mjs
